services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estacionei
      POSTGRES_USER: estacionei
      POSTGRES_PASSWORD: estacionei
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estacionei -d estacionei"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_NAME: estacionei
      DB_USER: estacionei
      DB_PASSWORD: estacionei
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "1421:1421"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
